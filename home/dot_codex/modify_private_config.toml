{{- /* chezmoi:modify-template */ -}}
{{- /* `codegraph install` only finds its table header at column 0 and otherwise appends a
       duplicate. Drop that copy (the shared definition replaces it) and write unindented. */ -}}
{{- $stdin := regexReplaceAll `(?m)^\[mcp_servers\.codegraph\]\r?\n(?:[^\s\[].*\n?|[ \t]*\r?\n)*` .chezmoi.stdin "" -}}
{{- $local := fromToml $stdin | default dict -}}
{{- $shared := includeTemplate "codex/config.toml.tmpl" . | fromToml -}}
{{- if not (hasKey $local "model") -}}
{{-   $_ := set $local "model" "gpt-5.6-sol" -}}
{{- end -}}
{{- /* Replace migrated MCP definitions, preserving unrelated local servers. */ -}}
{{- $servers := get $local "mcp_servers" | default dict -}}
{{- $_ := unset $servers "serena-2" -}}
{{- $_ := unset $servers "contex7-2" -}}
{{- range $name, $server := $shared.mcp_servers -}}
{{-   $_ := set $servers $name $server -}}
{{- end -}}
{{- $_ := set $local "mcp_servers" $servers -}}
{{- $_ := unset $shared "mcp_servers" -}}
{{ regexReplaceAll `(?m)^[ \t]+` (mergeOverwrite $local $shared | toToml) "" }}
